# SuperKeys bindings. List every modifier, including command.
# ⌃⌘A is SoundSource. Configure it there. Do not add an audio bind.
# Edit this file, then run `super-keys` again. A Swift change still needs a rebuild.

browser = '/Applications/Brave Browser.app'

# Launch — macOS and Omarchy

[[bind]]
id = "terminal"
group = "launch"
scope = ["macos", "omarchy"]
command = "return"
modifiers = ["command"]
action = "launch"
app = '/Applications/Ghostty.app'

[[bind]]
id = "browser"
group = "launch"
scope = ["macos", "omarchy"]
command = "return"
modifiers = ["command", "shift"]
action = "launch"
app = '/Applications/Brave Browser.app'

[[bind]]
id = "ai-assistant"
group = "launch"
scope = ["macos", "omarchy"]
command = "a"
modifiers = ["command", "shift"]
action = "open-url"
url = 'https://grok.com'

[[bind]]
id = "email"
group = "launch"
scope = ["macos", "omarchy"]
command = "e"
modifiers = ["command", "shift"]
action = "launch"
app = '/System/Applications/Mail.app'

[[bind]]
id = "finder"
group = "launch"
scope = ["macos", "omarchy"]
command = "f"
modifiers = ["command", "shift"]
action = "launch"
app = '/System/Library/CoreServices/Finder.app'

[[bind]]
id = "obsidian"
group = "launch"
scope = ["macos", "omarchy"]
command = "o"
modifiers = ["command", "shift"]
action = "launch"
app = '/Applications/Obsidian.app'

[[bind]]
id = "music"
group = "launch"
scope = ["macos", "omarchy"]
command = "m"
modifiers = ["command", "shift"]
action = "launch"
app = '/System/Applications/Music.app'

[[bind]]
id = "music-secondary"
group = "launch"
scope = ["macos", "omarchy"]
command = "m"
modifiers = ["command", "shift", "option"]
action = "open-url"
url = 'https://music.youtube.com'

[[bind]]
id = "passwords"
group = "launch"
scope = ["macos", "omarchy"]
command = "slash"
modifiers = ["command", "shift"]
action = "launch"
app = '/System/Applications/Passwords.app'

[[bind]]
id = "write"
group = "launch"
scope = ["macos", "omarchy"]
command = "w"
modifiers = ["command", "shift"]
action = "launch"
app = '/Applications/Typora.app'

[[bind]]
id = "youtube"
group = "launch"
scope = ["macos", "omarchy"]
command = "y"
modifiers = ["command", "shift"]
action = "open-url"
url = 'https://www.youtube.com/feed/subscriptions'

[[bind]]
id = "develop"
group = "launch"
scope = ["macos", "omarchy"]
command = "d"
modifiers = ["command", "shift"]
action = "launch"
app = '/Applications/Zed.app'

[[bind]]
id = "git-client"
group = "launch"
scope = ["macos", "omarchy"]
command = "g"
modifiers = ["command", "shift"]
action = "launch"
app = '/Applications/Fork.app'

[[bind]]
id = "talk"
group = "launch"
scope = ["macos", "omarchy"]
command = "t"
modifiers = ["command", "shift"]
action = "open-url"
url = 'https://web.telegram.org'

# Launch — macOS only

[[bind]]
id = "develop-secondary"
group = "launch"
scope = ["macos"]
command = "d"
modifiers = ["command", "shift", "option"]
action = "shell"
argv = ['/bin/zsh', '-c', 'open "${$(xcode-select -p)%/Contents/Developer}"']

[[bind]]
id = "system-settings"
group = "launch"
scope = ["macos"]
command = "s"
modifiers = ["command", "shift"]
action = "launch"
app = '/System/Applications/System Settings.app'

[[bind]]
id = "talk-secondary"
group = "launch"
scope = ["macos"]
command = "t"
modifiers = ["command", "shift", "option"]
action = "launch"
app = '/Applications/WhatsApp.app'

[[bind]]
id = "trash"
group = "launch"
scope = ["macos"]
command = "delete"
modifiers = ["command", "shift"]
action = "open-trash"

# Finder folder — macOS only

[[bind]]
id = "finder-terminal"
group = "finder"
scope = ["macos"]
command = "return"
modifiers = ["command", "control"]
action = "finder-open"
app = '/Applications/Ghostty.app'

[[bind]]
id = "finder-develop"
group = "finder"
scope = ["macos"]
command = "d"
modifiers = ["command", "shift", "control"]
action = "finder-open"
app = '/Applications/Zed.app'

[[bind]]
id = "finder-new-file"
group = "finder"
scope = ["macos"]
command = "f"
modifiers = ["command", "shift", "control"]
action = "finder-new-file"

[[bind]]
id = "finder-write"
group = "finder"
scope = ["macos"]
command = "w"
modifiers = ["command", "shift", "control"]
action = "finder-open"
app = '/Applications/Typora.app'

# System — macOS only

[[bind]]
id = "appearance"
group = "system"
scope = ["macos"]
command = "d"
modifiers = ["command", "control"]
action = "toggle-appearance"

[[bind]]
id = "sleep"
group = "system"
scope = ["macos"]
command = "s"
modifiers = ["command", "control"]
action = "sleep"

[[bind]]
id = "empty-trash"
group = "system"
scope = ["macos"]
command = "delete"
modifiers = ["command", "control"]
action = "empty-trash"
